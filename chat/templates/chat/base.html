{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}大模型对话台{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #f5f7fb;
            --panel: #ffffff;
            --border: #e3e8f0;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --user-bubble: #2563eb;
            --assistant-bubble: #ffffff;
            --danger: #dc2626;
            --success: #16a34a;
            --radius: 12px;
        }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        nav.topbar {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            gap: 24px;
            flex-shrink: 0;
        }
        nav.topbar .brand {
            font-weight: 700;
            font-size: 17px;
            color: var(--primary);
            text-decoration: none;
        }
        nav.topbar a.nav-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 8px;
        }
        nav.topbar a.nav-link:hover { background: #eef2ff; color: var(--primary); }
        nav.topbar a.nav-link.active { background: #eef2ff; color: var(--primary); }
        nav.topbar .user-box { margin-left: auto; display: flex; align-items: center; gap: 12px; }
        nav.topbar .user-name { font-size: 13px; color: var(--muted); }
        nav.topbar .logout-form { margin: 0; }
        nav.topbar .btn-sm { padding: 5px 12px; font-size: 13px; }
        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .btn {
            border: none;
            border-radius: 8px;
            padding: 9px 18px;
            font-size: 14px;
            cursor: pointer;
            transition: background .15s;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-primary:disabled { background: #9db8ef; cursor: not-allowed; }
        .btn-ghost { background: #f0f2f7; color: var(--text); }
        .btn-ghost:hover { background: #e4e8f0; }
        .btn-danger { background: #fee2e2; color: var(--danger); }
        input, textarea, select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }
        input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
        label.field { display: block; margin-bottom: 18px; }
        label.field .field-label {
            display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px;
        }
        label.field .help { font-size: 12px; color: var(--muted); margin-top: 5px; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="topbar">
        <a class="brand" href="{% url 'index' %}">大模型对话台</a>
        <a class="nav-link {% block nav_chat %}{% endblock %}" href="{% url 'index' %}">对话</a>
        <a class="nav-link {% block nav_settings %}{% endblock %}" href="{% url 'settings' %}">模型设置</a>
        <div class="user-box">
            <span class="user-name">👤 {{ user.username }}</span>
            <form class="logout-form" method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-ghost btn-sm">退出登录</button>
            </form>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
